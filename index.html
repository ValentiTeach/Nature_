<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="leaf leaf-1">🍃</div>
    <div class="leaf leaf-2">🌿</div>
    <div class="leaf leaf-3">🍂</div>

    <div class="app-container">
        <div id="start-screen" class="screen">
            <div class="nature-icon">🌳</div>
            <h2>Nature <em>Quiz</em></h2>
            <p class="subtitle">Дізнайся, наскільки добре ти знаєш природу</p>
            <button id="start-btn">Розпочати подорож</button>
        </div>

        <div id="quiz-screen" class="screen hide">
            <div class="header">
                <span id="timer">🕐 15с</span>
                <span id="score-display">🌱 0</span>
            </div>
            <h2 id="question-text">Запитання 1</h2>
            <div id="answers-container"></div>
        </div>

        <div id="result-screen" class="screen hide">
            <div class="nature-icon">🏞</div>
            <h2>Подорож <em>завершена</em></h2>
            <p class="result-text"></p>
            <button id="restart-btn">Спробувати знову</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
